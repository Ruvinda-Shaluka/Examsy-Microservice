spring.application.name=examsy-class-service
server.port=8083

# Connect to Spring Cloud Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Local Database Settings fallback (Docker MySQL on port 3307)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/examsy_class_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate Schema Validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Actuator Health & Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
