server.port=8888
spring.application.name=examsy-config-server

# Enable native profile for local mono-repo configuration
spring.profiles.active=native

# Location of config-repo (relative path resolves correctly from service directory or root)
spring.cloud.config.server.native.search-locations=file:../../config-repo,file:./config-repo,file:/config-repo

# Expose Actuator health endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
