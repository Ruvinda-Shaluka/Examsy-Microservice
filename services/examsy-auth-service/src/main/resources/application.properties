spring.application.name=examsy-auth-service
server.port=8081

# Connect to Spring Cloud Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Local Database Settings (pointing to Docker MySQL on host port 3307)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/examsy_auth_db?createDatabaseIfNotExist=true
spring.datasource.username=${EXAMSY_DB_USER:examsy_app}
spring.datasource.password=${EXAMSY_DB_PASSWORD:examsy_app_pass}

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate validates that entities match Flyway schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Actuator Health & Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:examsy-google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:examsy-google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend Redirect URL
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Forwarded headers strategy (for resolving {baseUrl} properly behind API Gateway)
server.forward-headers-strategy=framework


