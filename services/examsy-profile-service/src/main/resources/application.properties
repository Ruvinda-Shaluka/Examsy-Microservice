spring.application.name=examsy-profile-service
server.port=8082

# Connect to Spring Cloud Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Local Database Settings fallback (Docker MySQL on port 3307)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/examsy_profile_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate validates that entities match Flyway schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=profile-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Actuator Health & Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
