services:

  # ── 1. Relational Database: MySQL 8.0 ─────────────────────────────────────────
  # Runs one instance hosting 8 isolated schemas (Database-per-Service pattern)
  mysql:
    image: mysql:8.0
    container_name: examsy-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - examsy-network

  # ── 2. In-Memory Cache & Rate Limiter: Redis 7 ────────────────────────────────
  # Used by API Gateway for distributed rate limiting & token management
  redis:
    image: redis:7-alpine
    container_name: examsy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - examsy-network

  # ── 3. Kafka Coordination: Zookeeper ──────────────────────────────────────────
  # Coordinates leader election and broker states for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: examsy-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - examsy-network

  # ── 4. Event Streaming Broker: Apache Kafka ──────────────────────────────────
  # Asynchronous event bus for inter-service communication
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: examsy-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      # PLAINTEXT is for host machine (localhost:9092)
      # PLAINTEXT_INTERNAL is for internal docker network (kafka:29092)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - examsy-network

  # ── 5. Visual Kafka Dashboard: Kafka UI ───────────────────────────────────────
  # Open http://localhost:9000 to monitor topics, messages, and consumer groups
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: examsy-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: examsy-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - examsy-network

volumes:
  mysql_data:
    driver: local

networks:
  examsy-network:
    driver: bridge
