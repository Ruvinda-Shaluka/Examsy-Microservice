services:

  # ── 1. Relational Database: MySQL 8.0 ─────────────────────────────────────────
  # Runs one instance hosting 8 isolated schemas (Database-per-Service pattern)
  mysql:
    image: mysql:8.0
    container_name: examsy-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u examsy_app -p$${EXAMSY_DB_PASSWORD:-examsy_app_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - examsy-network

  # ── 2. In-Memory Cache & Rate Limiter: Redis 7 ────────────────────────────────
  # Used by API Gateway for distributed rate limiting & token management
  redis:
    image: redis:7-alpine
    container_name: examsy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - examsy-network

  # ── 3. Kafka Coordination: Zookeeper ──────────────────────────────────────────
  # Coordinates leader election and broker states for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: examsy-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - examsy-network

  # ── 4. Event Streaming Broker: Apache Kafka ──────────────────────────────────
  # Asynchronous event bus for inter-service communication
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: examsy-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - examsy-network

  # ── 5. Visual Kafka Dashboard: Kafka UI ───────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: examsy-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: examsy-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - examsy-network

  # ── 6. Distributed Tracing: OpenZipkin ─────────────────────────────────────────
  # Ingests and renders distributed request traces across Gateway & Services
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: examsy-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - examsy-network

  # ── 7. Centralized Metrics Scraping: Prometheus ────────────────────────────────
  # Scrapes Spring Boot Actuator /actuator/prometheus endpoints
  prometheus:
    image: prom/prometheus:latest
    container_name: examsy-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - examsy-network

  # ── 8. Observability Visualizer: Grafana ──────────────────────────────────────
  # Real-time interactive dashboards for latency, throughput, and error metrics
  grafana:
    image: grafana/grafana:latest
    container_name: examsy-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - zipkin
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - examsy-network

volumes:
  mysql_data:
    driver: local

networks:
  examsy-network:
    driver: bridge
