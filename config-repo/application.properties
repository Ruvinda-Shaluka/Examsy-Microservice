# ===================================================================
# Examsy Microservices: Global Shared Configuration
# Inherited automatically by ALL microservices that connect to Config Server
# ===================================================================

# Eureka Service Discovery Registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Spring Boot Actuator (Health, Metrics, Prometheus & Tracing)
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true

# Distributed Tracing & Metrics (Micrometer Tracing + Zipkin)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

# Shared Kafka Bootstrap Broker
spring.kafka.bootstrap-servers=localhost:9092

# ===================================================================
# Centralized Security & JWT Configuration
# Shared across all microservices; overrides in-code defaults
# ===================================================================
jwt.secret=${JWT_SECRET:examsySuperSecureEnterpriseSecretKeyMustBeAtLeast256BitsLongForHMACSHA256!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

