# ===================================================================
# Examsy Auth Service Configuration
# Service Port: 8081 | Database: examsy_auth_db
# ===================================================================

server.port=8081
spring.application.name=examsy-auth-service

# Database Connection (Pointing to Docker MySQL container on port 3307)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/examsy_auth_db?createDatabaseIfNotExist=true
spring.datasource.username=${EXAMSY_DB_USER:examsy_app}
spring.datasource.password=${EXAMSY_DB_PASSWORD:examsy_app_pass}
spring.datasource.hikari.maximum-pool-size=10

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate (Validates schema against Flyway)
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Mail Configuration (Password reset & verification)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:examsy-google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:examsy-google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend Redirect URL
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Forwarded headers strategy (for resolving {baseUrl} properly behind API Gateway)
server.forward-headers-strategy=framework
