name: Examsy Microservices CI Pipeline

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
  pull_request:
    branches:
      - main
      - development

jobs:
  # ── 1. Maven Compilation & Test Matrix ──────────────────────────────────────
  compile-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - examsy-common
          - examsy-config-server
          - examsy-eureka-server
          - examsy-api-gateway
          - examsy-auth-service
          - examsy-profile-service
          - examsy-class-service
          - examsy-exam-service
          - examsy-grading-service
          - examsy-notification-service
          - examsy-admin-service

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Common Library (Local Repository)
        run: mvn -B clean install -DskipTests -f services/examsy-common/pom.xml

      - name: Build & Test Service
        run: mvn -B clean test -f services/${{ matrix.service }}/pom.xml

  # ── 2. Docker Compose & Manifest Syntax Validation ──────────────────────────
  docker-and-k8s-validation:
    name: Validate Docker Compose & Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q
          echo "Docker Compose configuration is valid."

      - name: Validate Kubernetes Manifests
        run: |
          python3 -c "
          import os, yaml
          k8s_dir = 'infra/k8s'
          for root, _, files in os.walk(k8s_dir):
              for f in files:
                  if f.endswith('.yml') or f.endswith('.yaml'):
                      p = os.path.join(root, f)
                      with open(p, 'r') as fh:
                          list(yaml.safe_load_all(fh))
                      print(f'Valid YAML: {p}')
          "
          echo "All Kubernetes manifests successfully validated."
