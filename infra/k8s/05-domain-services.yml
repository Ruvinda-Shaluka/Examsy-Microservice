# ===================================================================
# Examsy Domain Services: Auth, Profile, Class, Exam, Grading,
# Notification, and Admin Microservices
# ===================================================================

# ── 1. Auth Service (Port 8081) ──────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: examsy-auth-service
  namespace: examsy
spec:
  ports:
    - port: 8081
      name: http
  selector:
    app: examsy-auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: examsy-auth-service
  namespace: examsy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: examsy-auth-service
  template:
    metadata:
      labels:
        app: examsy-auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/ruvinda-shaluka/examsy-auth-service:latest
          envFrom:
            - configMapRef:
                name: examsy-global-config
            - secretRef:
                name: examsy-secrets
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---

