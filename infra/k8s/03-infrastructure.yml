# ===================================================================
# Examsy Core Infrastructure: MySQL, Redis, Zookeeper, Kafka, Zipkin
# ===================================================================

# ── 1. MySQL 8 StatefulSet & Service ─────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: examsy-mysql
  namespace: examsy
spec:
  ports:
    - port: 3306
      name: mysql
  clusterIP: None
  selector:
    app: examsy-mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: examsy-mysql
  namespace: examsy
spec:
  serviceName: examsy-mysql
  replicas: 1
  selector:
    matchLabels:
      app: examsy-mysql
  template:
    metadata:
      labels:
        app: examsy-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examsy-secrets
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---

# ── 2. Redis 7 Deployment & Service ──────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: examsy-redis
  namespace: examsy
spec:
  ports:
    - port: 6379
      name: redis
  selector:
    app: examsy-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: examsy-redis
  namespace: examsy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: examsy-redis
  template:
    metadata:
      labels:
        app: examsy-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---

# ── 3. Kafka & Zookeeper Deployments & Services ──────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: examsy-zookeeper
  namespace: examsy
spec:
  ports:
    - port: 2181
      name: zookeeper
  selector:
    app: examsy-zookeeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: examsy-zookeeper
  namespace: examsy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: examsy-zookeeper
  template:
    metadata:
      labels:
        app: examsy-zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          ports:
            - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: examsy-kafka
  namespace: examsy
spec:
  ports:
    - port: 9092
      name: kafka
  selector:
    app: examsy-kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: examsy-kafka
  namespace: examsy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: examsy-kafka
  template:
    metadata:
      labels:
        app: examsy-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "examsy-zookeeper.examsy.svc.cluster.local:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://examsy-kafka.examsy.svc.cluster.local:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          ports:
            - containerPort: 9092
---

# ── 4. OpenZipkin Distributed Tracing ─────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: examsy-zipkin
  namespace: examsy
spec:
  ports:
    - port: 9411
      name: http
  selector:
    app: examsy-zipkin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: examsy-zipkin
  namespace: examsy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: examsy-zipkin
  template:
    metadata:
      labels:
        app: examsy-zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          env:
            - name: STORAGE_TYPE
              value: "mem"
          ports:
            - containerPort: 9411
