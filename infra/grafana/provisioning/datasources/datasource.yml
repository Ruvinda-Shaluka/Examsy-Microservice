apiVersion: 1

datasources:
  # 1. Prometheus Datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST

  # 2. OpenZipkin Tracing Datasource
  - name: Zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
